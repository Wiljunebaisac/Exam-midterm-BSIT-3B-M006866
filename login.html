
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | ScholarTrack</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js" defer></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f3f6fb;
      font-family: Arial, sans-serif;
      color: #172033;
    }
    .login-card {
      width: min(400px, calc(100% - 40px));
      padding: 32px;
      box-sizing: border-box;
      border-radius: 18px;
      background: white;
      box-shadow: 0 12px 40px #14213d14;
    }
    .brand {
      color: #1769e0;
      font-size: 27px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .subtitle { color: #697386; margin-bottom: 26px; }
    label { display: block; margin: 16px 0 7px; font-weight: 600; }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      border: 1px solid #d6dce6;
      border-radius: 9px;
      font-size: 15px;
    }
    button {
      width: 100%;
      padding: 13px;
      margin-top: 22px;
      border: 0;
      border-radius: 9px;
      background: #1769e0;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .65; cursor: wait; }
    #message {
      display: none;
      margin-top: 15px;
      padding: 11px;
      border-radius: 8px;
      font-size: 14px;
      overflow-wrap: anywhere;
    }
    .hint { font-size: 12px; color: #697386; margin-top: 18px; }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="brand">ScholarTrack</div>
    <h2>Welcome back</h2>
    <p class="subtitle">Sign in to your scholarship account.</p>

    <form id="loginForm">
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="username"
        placeholder="you@example.com" required>

      <label for="password">Password</label>
      <input id="password" type="password"
        autocomplete="current-password" placeholder="Enter password" required>

      <button id="loginButton" type="submit">Sign in</button>
      <div id="message" role="status" aria-live="polite"></div>
    </form>

    <p class="hint">Use the account provided or created for your ScholarTrack system.</p>
  </main>
</body>
</html>
